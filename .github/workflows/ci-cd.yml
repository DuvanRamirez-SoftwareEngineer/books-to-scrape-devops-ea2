name: CI - pruebas y CD - GitHub Pages EA3

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["develop", "main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas automatizadas
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Comprobar sintaxis del código
        run: python -m compileall -q src scripts
      - name: Ejecutar pruebas
        run: python -m pytest -v

  despliegue:
    name: Desplegar aplicación web en GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: pruebas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacion.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Cargar aplicación web estática
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Publicar aplicación web
        id: publicacion
        uses: actions/deploy-pages@v4
