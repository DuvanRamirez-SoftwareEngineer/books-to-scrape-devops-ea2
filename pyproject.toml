[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "books-to-scrape-devops-ea2"
version = "1.0.0"
description = "Proyecto académico de scraping con CI/CD"
requires-python = ">=3.10"
dependencies = ["beautifulsoup4>=4.12,<5", "requests>=2.31,<3"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
